[workspace]
members = ["crates/types", "crates/driver", "crates/host", "crates/replay"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WaiShe-Project/waishe-driver-sdk"

[workspace.dependencies]
waishe-driver-types = { path = "crates/types", version = "0.1.0" }
waishe-driver-host = { path = "crates/host", version = "0.1.0" }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
wasmi = "2.0.0"
thiserror = "2.0.21"
